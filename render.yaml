# Render Blueprint: https://render.com/docs/blueprint-spec
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: apartment-finder
    runtime: python
    plan: free
    region: singapore
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: apartment-media
      - key: SUPABASE_OAUTH_PROVIDERS
        value: google
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: ADMIN_NOTIFICATION_EMAILS
        sync: false
      - key: TIME_ZONE
        value: Asia/Dhaka
