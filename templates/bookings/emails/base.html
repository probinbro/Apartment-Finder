<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:0;background:#f1f5f9;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#0f172a">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:24px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:14px;overflow:hidden;border:1px solid #e2e8f0">
        <tr><td style="background:#0f766e;padding:18px 24px;color:#ffffff;font-size:18px;font-weight:700">🏠 {{ SITE_NAME }}</td></tr>
        <tr><td style="padding:24px">
          {% block content %}{% endblock %}
        </td></tr>
        <tr><td style="padding:16px 24px;background:#f8fafc;color:#64748b;font-size:12px;border-top:1px solid #e2e8f0">
          You received this email because of activity on your {{ SITE_NAME }} account. Never pay an advance before visiting a property.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
