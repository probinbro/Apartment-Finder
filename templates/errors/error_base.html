{% extends "base.html" %}
{% block content %}
<div class="container error-page">
  <div class="error-code">{% block code %}{% endblock %}</div>
  <h1 style="font-size:1.8rem">{% block heading %}{% endblock %}</h1>
  <p>{% block message %}{% endblock %}</p>
  <div class="btn-row" style="justify-content:center">
    <a class="btn btn-primary" href="{% url 'core:home' %}">{% icon "home" 18 %} Go home</a>
    <a class="btn btn-outline" href="{% url 'apartments:list' %}">Browse apartments</a>
  </div>
</div>
{% endblock %}
